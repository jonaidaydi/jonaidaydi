<svg
  width="620"
  height="110"
  viewBox="0 0 620 110"
  xmlns="http://www.w3.org/2000/svg"
>

  <style>
    text {
      font-family: "Caveat", cursive;
      font-size: 58px;
      font-weight: 600;
      text-anchor: middle;
    }
  </style>

  <g transform="translate(310 72)">

    <!-- 1. Hey! -->
    <text opacity="0" style="fill:#E67E22">
      Hey!

      <animate
        attributeName="opacity"
        values="0;1;1;0;0"
        keyTimes="0;0.02;0.18;0.20;1"
        dur="25s"
        repeatCount="indefinite"
      />

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 14;0 0;0 0;0 -10;0 -10"
        keyTimes="0;0.02;0.18;0.20;1"
        dur="25s"
        repeatCount="indefinite"
      />
    </text>


    <!-- 2. Bonjour! -->
    <text opacity="0" style="fill:#F97316">
      Bonjour!

      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.20;0.22;0.38;0.40;1"
        dur="25s"
        repeatCount="indefinite"
      />

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 14;0 14;0 0;0 0;0 -10;0 -10"
        keyTimes="0;0.20;0.22;0.38;0.40;1"
        dur="25s"
        repeatCount="indefinite"
      />
    </text>


    <!-- 3. Moien! -->
    <text opacity="0" style="fill:#C65F0A">
      Moien!

      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.40;0.42;0.58;0.60;1"
        dur="25s"
        repeatCount="indefinite"
      />

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 14;0 14;0 0;0 0;0 -10;0 -10"
        keyTimes="0;0.40;0.42;0.58;0.60;1"
        dur="25s"
        repeatCount="indefinite"
      />
    </text>


    <!-- 4. Selam! -->
    <text opacity="0" style="fill:#D97706">
      Selam!

      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.60;0.62;0.78;0.80;1"
        dur="25s"
        repeatCount="indefinite"
      />

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 14;0 14;0 0;0 0;0 -10;0 -10"
        keyTimes="0;0.60;0.62;0.78;0.80;1"
        dur="25s"
        repeatCount="indefinite"
      />
    </text>


    <!-- 5. Willkommen! -->
    <text opacity="0" style="fill:#E85D04">
      Willkommen!

      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;0.80;0.82;0.98;1"
        dur="25s"
        repeatCount="indefinite"
      />

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 14;0 14;0 0;0 0;0 -10"
        keyTimes="0;0.80;0.82;0.98;1"
        dur="25s"
        repeatCount="indefinite"
      />
    </text>

  </g>

</svg>
