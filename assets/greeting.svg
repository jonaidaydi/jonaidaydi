<svg width="620" height="95" viewBox="0 0 620 95"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    text {
      font-family: "Fira Code", monospace;
      font-size: 54px;
      font-weight: 700;
      fill: #2EA043;
      text-anchor: middle;
    }
  </style>

  <g transform="translate(310 63)">

    <text opacity="0">Moien!
      <animate attributeName="opacity"
               values="0;1;1;0;0"
               keyTimes="0;0.08;0.18;0.25;1"
               dur="15s"
               repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 14;0 0;0 0;0 -10"
                        keyTimes="0;0.08;0.18;0.25"
                        dur="15s"
                        repeatCount="indefinite"/>
    </text>

    <text opacity="0">Selam!
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.16;0.24;0.34;0.41;1"
               dur="15s"
               repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 14;0 14;0 0;0 0;0 -10"
                        keyTimes="0;0.16;0.24;0.34;0.41"
                        dur="15s"
                        repeatCount="indefinite"/>
    </text>

    <text opacity="0">Bonjour!
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.33;0.41;0.51;0.58;1"
               dur="15s"
               repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 14;0 14;0 0;0 0;0 -10"
                        keyTimes="0;0.33;0.41;0.51;0.58"
                        dur="15s"
                        repeatCount="indefinite"/>
    </text>

    <text opacity="0">Hey!
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.50;0.58;0.68;0.75;1"
               dur="15s"
               repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 14;0 14;0 0;0 0;0 -10"
                        keyTimes="0;0.50;0.58;0.68;0.75"
                        dur="15s"
                        repeatCount="indefinite"/>
    </text>

    <text opacity="0">Salam!
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.67;0.75;0.85;0.92;1"
               dur="15s"
               repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 14;0 14;0 0;0 0;0 -10"
                        keyTimes="0;0.67;0.75;0.85;0.92"
                        dur="15s"
                        repeatCount="indefinite"/>
    </text>

  </g>
</svg>
